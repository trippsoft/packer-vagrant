          rm -f ./fedora/vagrant/boxes/${{ matrix.box }}_base/libvirt-amd64.box || /bin/true
      - name: Cleanup old Fedora box versions
        run: |
          find /mnt/vagrant-boxes/${{ matrix.box }}_base/ -mindepth 1 -maxdepth 1 -type d ! -name "${{ needs.setup.outputs.version }}" -exec rm -rf {} + || /bin/true
  rocky_base:
    name: Build Rocky boxes with base only
    needs: setup
    runs-on:
      - self-hosted
