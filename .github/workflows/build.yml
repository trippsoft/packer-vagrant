---
name: Build QEMU Boxes
'on':
  workflow_dispatch: {}
  schedule:
    - cron: '10 0 * * 3'
jobs:
  setup:
    name: Setup
    runs-on:
      - self-hosted
      - Linux
      - X64
      - packer
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Install prerequisites
        run: |
          ./.github/workflows/scripts/install-prerequisites.sh
      - name: Set version
        id: version
        run: |
          echo "Version: $(date +'%Y.%m.%d')"
          echo "version=$(date +'%Y.%m.%d')" >> $GITHUB_OUTPUT
    outputs:
      version: ${{ steps.version.outputs.version }}
  debian:
    name: Build Debian boxes
    needs: setup
    runs-on:
      - self-hosted
      - Linux
      - packer
      - X64
    strategy:
      fail-fast: false
      matrix:
        box:
          - debian13
          - debian12
    env:
      TMPDIR: /var/tmp
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Build base Debian install
        run: |
          ./.github/workflows/scripts/build-base.sh ansible-2.21 debian ${{ matrix.box }}
      - name: Build base Debian box
        run: |
          ./.github/workflows/scripts/build-box.sh ansible-2.21 debian ${{ matrix.box }} base
      - name: Cleanup base Debian install
        run: |
          rm -rf ./debian/01-base/output || /bin/true
      - name: Get box SHA256 Hash
        id: hash
        run: |
          echo "sha256=$(sha256sum ./debian/vagrant/boxes/${{ matrix.box }}_base/libvirt-amd64.box | awk '{print $1}')" >> $GITHUB_OUTPUT
      - name: Copy box to NAS
        env:
          CATALOG_JSON: |-
            {
              "name": "trippsc2/${{ matrix.box }}_base",
              "versions": [
                {
                  "version": "${{ needs.setup.outputs.version }}",
                  "providers": [
                    {
                      "name": "libvirt",
                      "architecture": "amd64",
                      "url": "/mnt/vagrant-boxes/${{ matrix.box }}_base/${{ needs.setup.outputs.version }}/libvirt-amd64.box",
                      "checksum_type": "sha256",
                      "checksum": "${{ steps.hash.outputs.sha256 }}"
                    }
                  ]
                }
              ]
            }
        run: |
          mkdir -p /mnt/vagrant-boxes/${{ matrix.box }}_base/${{ needs.setup.outputs.version }}
          cp ./debian/vagrant/boxes/${{ matrix.box }}_base/libvirt-amd64.box /mnt/vagrant-boxes/${{ matrix.box }}_base/${{ needs.setup.outputs.version }}/
          echo "$CATALOG_JSON" > /mnt/vagrant-boxes/${{ matrix.box }}_base/catalog.json
          echo "Copied box to NAS at /mnt/vagrant-boxes/${{ matrix.box }}_base/${{ needs.setup.outputs.version }}"
      - name: Cleanup base Debian box
        run: |
          rm -rf ./debian/vagrant/output || /bin/true
          rm -f ./debian/vagrant/boxes/${{ matrix.box }}_base/libvirt-amd64.box || /bin/true
      - name: Cleanup old Debian box versions
        run: |
          find /mnt/vagrant-boxes/${{ matrix.box }}_base/ -mindepth 1 -maxdepth 1 -type d ! -name "${{ needs.setup.outputs.version }}" -exec rm -rf {} + || /bin/true
